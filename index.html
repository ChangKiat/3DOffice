<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Office</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <button id="meeting" class="meeting" type="button" disabled>Call meeting</button>
    <section id="chat" class="chat">
      <header class="chat-header">
        <label for="chat-staff">Ask</label>
        <select id="chat-staff"></select>
        <button id="chat-toggle" class="chat-toggle" type="button" aria-label="Minimise chat">–</button>
      </header>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Type a question…" autocomplete="off" maxlength="2000" />
        <button id="chat-send" type="submit">Send</button>
      </form>
    </section>
    <div class="hint">Drag to rotate · Scroll to zoom · Click a person to chat</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
